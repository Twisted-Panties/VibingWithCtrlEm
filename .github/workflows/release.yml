name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single-File Executable
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish VibingWithCtrlEm/VibingWithCtrlEm.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$tag -p:AssemblyVersion=$tag.0 -p:FileVersion=$tag.0 -o publish/

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: publish/VibingWithCtrlEm.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
